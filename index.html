<title>ROCKSIDE – 海音の冒険</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d0f1a;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
body{position:fixed;inset:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
#screen{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;background:#000;}
#pad{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;z-index:2;}
.btn{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  color:#d6e6ff;font:800 16px/1 system-ui,-apple-system,sans-serif;letter-spacing:1px;
  border:3px solid #4a5a80;background:#1c2338;box-shadow:0 6px 0 #070a14;
  transition:transform 45ms,background-color 45ms,box-shadow 45ms;pointer-events:none;}
.btn svg{width:46%;height:46%;}
.btn.on{transform:translateY(5px) scale(.94);box-shadow:0 1px 0 #070a14;color:#fff;}
.dpad{border-radius:20px;}
.dpad.on{background:#3a64c8;border-color:#a9c8ff;}
.round{border-radius:50%;}
#bS{border-color:#b85068;background:#2c1822;}
#bS.on{background:#d8466a;border-color:#ffb3c4;}
#bJ{border-color:#4fae6e;background:#16281e;}
#bJ.on{background:#3fbf68;border-color:#bfffd2;}
#mute{position:absolute;box-sizing:border-box;padding:0 10px;height:30px;border-radius:15px;text-align:center;
  border:2px solid #3a4666;background:#141a2c;color:#9fb0d8;font:700 12px/26px system-ui,sans-serif;letter-spacing:1px;
  pointer-events:auto;white-space:nowrap;}
#mute.off{color:#ff8a8a;border-color:#6a3040;}
#hint{position:absolute;left:0;width:100%;text-align:center;color:#46557a;font:600 11px/1.3 system-ui,sans-serif;pointer-events:none;letter-spacing:1px;}
body.land .btn{opacity:.6;}
body.land .btn.on{opacity:.9;}
body.land #hint{display:none;}
</style>

<script>
'use strict';
// =====================================================================
//  ROCKSIDE  -  original run-and-gun prototype
//  All gameplay tuning lives in CONFIG. Units: pixels and frames @60Hz.
// =====================================================================
const CONFIG = {
  // ---- display ----
  viewW: 256, viewH: 240, tile: 16,

  // ---- player movement ----
  gravity: 0.25,          // px/frame^2
  maxFall: 7.0,           // terminal fall speed px/frame
  jumpVel: 5.0,           // initial jump speed -> apex ~50px (~3 tiles)
  jumpCutVel: 1.0,        // releasing jump while rising clamps upward speed to this (variable jump height)
  runSpeed: 1.5,          // px/frame
  runAccel: 0.5,          // ground accel (full speed in 3 frames)
  airAccel: 0.5,          // air accel
  stopDecel: 1.5,         // decel when no input (>= runSpeed means instant stop, no slide)
  coyoteFrames: 6,        // can still jump this many frames after leaving a ledge
  jumpBufferFrames: 6,    // jump pressed this many frames before landing still triggers

  // ---- shooting ----
  shotSpeed: 4.5,
  maxShots: 3,
  shotCooldown: 8,        // frames between shots
  shootPoseFrames: 16,    // how long the arm-cannon pose stays up
  autoFire: true,         // holding SHOT keeps firing (mobile friendly)
  autoFireInterval: 10,
  shotDamage: 1,

  // ---- player health ----
  playerMaxHP: 16,
  invincFrames: 90,       // blinking mercy frames after a hit
  knockbackFrames: 18,    // frames of lost control after a hit
  knockbackSpeed: 1.0,    // px/frame pushed away while stunned
  hurtHitStop: 4,         // freeze frames on hit
  hurtShake: 3,
  killHitStop: 2,

  // ---- enemies ----
  enemy: {
    activateMargin: 40,   // px outside the camera where enemies start updating
    bulletDamage: 2,
    // hurtUp: the hurtbox (what shots/arrows hit) reaches this many px ABOVE the
    // contact box, so a standing shot on the same floor (spawns ~17px above the
    // feet) connects. Contact damage still uses the small body box (e.w x e.h).
    walker: { hp: 2, speed: 0.5, damage: 2, hurtUp: 8 },   // contact 12x12, hurtbox 12x20
    hopper: { hp: 3, jumpVel: 4.5, hopSpeed: 1.2, waitFrames: 55, damage: 3, hurtUp: 9 }, // contact 12x11, hurtbox 12x20
    flyer:  { hp: 2, speed: 0.5, bobAmp: 10, fireInterval: 130, bulletSpeed: 1.3, damage: 2, leash: 96 },
  },

  // ---- boss: 闇落ち飛梅 (Dark Tobiume) - flying boss ----
  boss: {
    hp: 20,
    iFrames: 8,             // invulnerable flash after each hit
    contactDamage: 3,
    bulletDamage: 2,        // heart / star magic bullets
    shockDamage: 3,         // floor shockwave from the dive kick
    hoverY: 150, hoverBob: 10, driftSpeed: 0.9,     // hover height (top of hitbox) / bob amplitude / side drift
    idleFrames: 55, idleFramesRage: 32,             // pause between attacks (rage = below 50% HP)
    fanCount: 5, fanSpread: 0.30, fanSpeed: 1.7, fanWindup: 26, fanVolleysRage: 2,
    swoopTelegraph: 28, swoopSpeed: 3.4, landFrames: 26,
    kickRiseY: 36, kickAimFrames: 40, kickAimSpeed: 2.2, kickSpeed: 6.5, shockSpeed: 2.0,
    recoverSpeed: 1.6,
    rescueLineFrames: 260,  // how long her thank-you line stays before STAGE CLEAR (tap skips)
  },

  // ---- allies (can't be hurt, don't block) ----
  allies: {
    talkRange: 56,          // px: speech bubble trigger distance
    bubbleFrames: 220,
    neeniaRange: 170,       // player within this horizontal distance -> support fire
    neeniaTargetRange: 230, // enemies within this distance of her get shot
    neeniaInterval: 60, arrowSpeed: 4.2, arrowDamage: 1,
    seitenRange: 44, seitenHealEvery: 6,   // +1 HP every N frames while near
  },

  // ---- optional sprite sheets in ./assets (falls back to procedural art) ----
  useSpriteSheets: true,

  // ---- stage select ----
  introFrames: 200,        // boss-intro flash length after choosing an area (tap skips after ~1 s)

  // ---- camera / fx ----
  cameraLerp: 0.18,
  bossScrollSpeed: 3,
};

// ---------------------------------------------------------------------
//  URL debug params: ?boss=1 (start at checkpoint before boss room),
//  ?god=1 (no damage), ?hitbox=1 (draw hitboxes), ?sprites=0 (procedural art), ?sprites=folder (load assets/*.png instead of embedded)
//  ?unlockall=1 (stage select: final centre area unlocked without clearing all 8; progress is not written)
// ---------------------------------------------------------------------
const QS = new URLSearchParams(location.search);
const DEBUG = { boss: QS.get('boss') === '1', god: QS.get('god') === '1', hitbox: QS.get('hitbox') === '1', noSprites: QS.get('sprites') === '0',
  unlockAll: QS.get('unlockall') === '1' };

// =====================================================================

//  . empty  # rock/metal  = girder   P player start  C checkpoint
//  W walker  H hopper  F flyer   D boss door   B boss spawn
//  A アスターテ (guide; the last one is the checkpoint)  N ネーニア (archer)  S 青天 (healer)

const STAGE_SUNSET_HILLS = [

// =====================================================================
//  AREAS  - the stage-select grid (3x3, Mega Man style). Story: every friend
//  appears as a shadow-coloured "DARK <name>" boss; beating her restores her
//  and she joins as an ally (progress.rescued, localStorage).
//  Data-driven: to add a stage, give an entry a `map` (screens like
//  STAGE_SUNSET_HILLS), a `boss` key from BOSS_TYPES (04_game.js), a `theme`
//  key from THEMES (03_world.js), a `friend` id (who is rescued) and a
//  `portrait` (20x20 crop of a sprite-sheet frame; shadow: true = dark
//  silhouette with glowing eyes, SHEET_DEFS[sheet].eyes).
//  Entries without a map show COMING SOON; `reserved` = ??? slot for a future friend.
//  `guests`: in-stage helpers allowed before they are rescued (story exception).
//  slot: 0 1 2 / 3 [4] 5 / 6 7 8 - slot 4 (centre) is the final area,
//  unlocked only after all 8 outer areas are cleared.
// =====================================================================
const AREAS = [
  { id: 'sunset', slot: 0, name: '夕焼けの丘', en: 'SUNSET HILLS', friend: 'tobiume', boss: 'tobiume',
    bossName: 'DARK 飛梅', bossAlias: '闇落ち飛梅', bossEn: 'DARK TOBIUME',
    portrait: { sheet: 'tobiume', frame: 0, x: 18, y: 3, size: 20 },
    portraitRescued: { sheet: 'tobiumeNormal', frame: 0, x: 3, y: 1, size: 20 },   // shown once she is rescued
    map: STAGE_SUNSET_HILLS, theme: 'sunset',
    guests: ['A', 'N', 'S'] },  // first stage: Astarte / Neenia / Seiten help even though their DARK stages come later
  { id: 'neenia', slot: 2, friend: 'neenia', bossName: 'DARK ネーニア', bossEn: 'DARK NEENIA',
    portrait: { sheet: 'neenia', frame: 0, x: 3, y: 1, size: 20, shadow: true } },
  { id: 'seiten', slot: 6, friend: 'seiten', bossName: 'DARK 青天', bossEn: 'DARK SEITEN',
    portrait: { sheet: 'seiten', frame: 0, x: 5, y: 2, size: 20, shadow: true } },
  { id: 'astarte', slot: 8, friend: 'astarte', bossName: 'DARK アスターテ', bossEn: 'DARK ASTARTE',
    portrait: { sheet: 'astarte', frame: 0, x: 3, y: 2, size: 20, shadow: true } },
  { id: 'friend5', slot: 1, reserved: true }, { id: 'friend6', slot: 3, reserved: true },
  { id: 'friend7', slot: 5, reserved: true }, { id: 'friend8', slot: 7, reserved: true },
  { id: 'final', slot: 4, final: true, name: '最終エリア', en: 'FINAL AREA' }, // no stage yet -> "coming soon" even when unlocked
];
// in-stage ally type (map letter) -> friend id
const ALLY_FRIEND = { A: 'astarte', N: 'neenia', S: 'seiten' };

// =====================================================================
//  Globals / setup
// =====================================================================
const VW = CONFIG.viewW, VH = CONFIG.viewH, TS = CONFIG.tile;
const ROWS = 15, SCREEN_COLS = 16;
const T_EMPTY = 0, T_ROCK = 1, T_GIRDER = 2, T_DOOR = 3;
// ---- current stage (rebuilt by loadMap when an area is chosen on the stage select) ----
let MAP = [], COLS = 0, LEVEL_W = 0, grid = new Uint8Array(0), ROOM_X = 0;
const spawns = [];     // enemies {type,c,r}
const allySpawns = []; // allies {type,c,r}
let START_C = 2, START_R = 12, CP_C = 0, CP_R = 12, ROOM_COL = 0, BOSS_C = 0, BOSS_R = 12;
const DOOR_ROWS = [];
function loadMap(screens) {
  for (let s = 0; s < screens.length; s++) {
    if (screens[s].length !== ROWS) throw new Error('Screen ' + s + ' has ' + screens[s].length + ' rows');
    for (let r = 0; r < ROWS; r++) if (screens[s][r].length !== SCREEN_COLS) throw new Error('Screen ' + s + ' row ' + r + ' bad width');
  }
  MAP = [];
  for (let r = 0; r < ROWS; r++) { let row = ''; for (let s = 0; s < screens.length; s++) row += screens[s][r]; MAP.push(row); }
  COLS = MAP[0].length; LEVEL_W = COLS * TS; grid = new Uint8Array(COLS * ROWS);
  spawns.length = 0; allySpawns.length = 0; DOOR_ROWS.length = 0;
  START_C = 2; START_R = 12; CP_C = 0; CP_R = 12; ROOM_COL = 0; BOSS_C = 0; BOSS_R = 12;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = MAP[r][c]; let t = T_EMPTY;
    if (ch === '#') t = T_ROCK; else if (ch === '=') t = T_GIRDER;
    else if (ch === 'D') { t = T_DOOR; ROOM_COL = c; DOOR_ROWS.push(r); }
    else if (ch === 'P') { START_C = c; START_R = r; }
    else if (ch === 'C') { CP_C = c; CP_R = r; }
    else if (ch === 'B') { BOSS_C = c; BOSS_R = r; }
    else if (ch === 'W' || ch === 'H' || ch === 'F') spawns.push({ type: ch, c: c, r: r });
    else if (ch === 'A' || ch === 'N' || ch === 'S') allySpawns.push({ type: ch, c: c, r: r });
    grid[r * COLS + c] = t;
  }
  ROOM_X = ROOM_COL * TS;
  spawns.sort((a, b) => a.c - b.c); // enemies ordered left -> right
  allySpawns.sort((a, b) => a.c - b.c);
  // the right-most Astarte is the checkpoint
  for (const a of allySpawns) if (a.type === 'A') { CP_C = a.c; CP_R = a.r; }
}
loadMap(AREAS[0].map);

// =====================================================================
//  Canvas: low-res buffer scaled with nearest neighbour to the screen
// =====================================================================
const screen = document.getElementById('screen');
const sctx = screen.getContext('2d', { alpha: false });
const buf = mkCanvas(VW, VH);
const g = buf.getContext('2d');
g.imageSmoothingEnabled = false;

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hash(a, b) { let h = Math.imul(a, 73856093) ^ Math.imul(b, 19349663); h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; }

// ---------------------------------------------------------------------
//  Pixel font (5x5 bitmap), pre-rendered to a colour atlas
// ---------------------------------------------------------------------
const GLYPHS = {
A:'0111010001111111000110001',B:'1111010001111101000111110',C:'0111110000100001000001111',D:'1111010001100011000111110',
E:'1111110000111101000011111',F:'1111110000111101000010000',G:'0111110000100111000101111',H:'1000110001111111000110001',
I:'1111100100001000010011111',J:'0011100001000011000101110',K:'1000110010111001001010001',L:'1000010000100001000011111',
M:'1000111011101011000110001',N:'1000111001101011001110001',O:'0111010001100011000101110',P:'1111010001111101000010000',
Q:'0111010001101011001001101',R:'1111010001111101001010001',S:'0111110000011100000111110',T:'1111100100001000010000100',
U:'1000110001100011000101110',V:'1000110001100010101000100',W:'1000110001101011101110001',X:'1000101010001000101010001',
Y:'1000101010001000010000100',Z:'1111100010001000100011111',
'0':'0111010011101011100101110','1':'0010001100001000010001110','2':'1111000001011101000011111','3':'1111000001011100000111110',
'4':'1001010010111110001000010','5':'1111110000111100000111110','6':'0111010000111101000101110','7':'1111100001000100010000100',
'8':'0111010001011101000101110','9':'0111010001011110000101110',
' ':'0000000000000000000000000','!':'0010000100001000000000100','.':'0000000000000000000000100',':':'0000000100000000010000000',
'-':'0000000000011100000000000','/':'0000100010001000100010000','?':'0111010001001100000000100',"'":'0010000100000000000000000',
',':'0000000000000000010001000','>':'0100000100000100010001000','(':'0001000100001000010000010',')':'0100000100001000010001000',
'+':'0000000100011100010000000'
};
const FONT_CHARS = Object.keys(GLYPHS).join('');
const FONT_IDX = new Int16Array(128).fill(-1);
for (let i = 0; i < FONT_CHARS.length; i++) FONT_IDX[FONT_CHARS.charCodeAt(i)] = i;
const FONT_COLORS = { w: '#ffffff', y: '#ffd84a', c: '#7ff0ff', r: '#ff5d5d', k: '#120e24', g: '#8be07a', b: '#8fa2d8' };
const FONT_CI = {};
const fontAtlas = mkCanvas(FONT_CHARS.length * 6, Object.keys(FONT_COLORS).length * 6);
(function buildFont() {
  const fg = fontAtlas.getContext('2d'); let ci = 0;
  for (const k in FONT_COLORS) {
    FONT_CI[k] = ci; fg.fillStyle = FONT_COLORS[k];
    for (let i = 0; i < FONT_CHARS.length; i++) {
      const bits = GLYPHS[FONT_CHARS[i]];
      for (let p = 0; p < 25; p++) if (bits.charCodeAt(p) === 49) fg.fillRect(i * 6 + (p % 5), ci * 6 + ((p / 5) | 0), 1, 1);
    }
    ci++;
  }
})();
function textWidth(str, s) { return str.length * 6 * s - s; }
function drawText(str, x, y, col, s, align) {
  s = s || 1; const ci = FONT_CI[col] * 6;
  if (align === 'c') x -= (textWidth(str, s) / 2) | 0; else if (align === 'r') x -= textWidth(str, s);
  for (let i = 0; i < str.length; i++) {
    const code = str.charCodeAt(i); const gi = code < 128 ? FONT_IDX[code] : -1;
    if (gi >= 0) g.drawImage(fontAtlas, gi * 6, ci, 5, 5, x + i * 6 * s, y, 5 * s, 5 * s);
  }
}
function drawTextShadow(str, x, y, col, s, align) { drawText(str, x + s, y + s, 'k', s, align); drawText(str, x, y, col, s, align); }

// ---------------------------------------------------------------------
//  Sprite helpers: programmatic pixel art -> small canvases
//  (Procedural fallback art, one function per character: artHero / artWalker /
//   artHopper / artFlyer here, artTobiume / artAstarte / artNeenia / artSeiten in
//   02b_chars.js. Real sprite sheets (assets/*.png, embedded at build time) replace
//   them via SHEET_DEFS/loadSheets and drawPlayer / drawBoss / drawAllySprite.)
// ---------------------------------------------------------------------
function outlineCanvas(c, rgb) {
  const cg = c.getContext('2d'), w = c.width, h = c.height;
  const id = cg.getImageData(0, 0, w, h), d = id.data, a = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) a[i] = d[i * 4 + 3] > 0 ? 1 : 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x; if (a[i]) continue;
    if ((x > 0 && a[i - 1]) || (x < w - 1 && a[i + 1]) || (y > 0 && a[i - w]) || (y < h - 1 && a[i + w])) {
      d[i * 4] = rgb[0]; d[i * 4 + 1] = rgb[1]; d[i * 4 + 2] = rgb[2]; d[i * 4 + 3] = 255;
    }
  }
  cg.putImageData(id, 0, 0);
}
function flipCanvas(c) { const f = mkCanvas(c.width, c.height), fg = f.getContext('2d'); fg.translate(c.width, 0); fg.scale(-1, 1); fg.drawImage(c, 0, 0); return f; }
function whiteCanvas(c) { const f = mkCanvas(c.width, c.height), fg = f.getContext('2d'); fg.drawImage(c, 0, 0); fg.globalCompositeOperation = 'source-in'; fg.fillStyle = '#fff'; fg.fillRect(0, 0, c.width, c.height); return f; }
function makeSprite(w, h, artFn, outline) {
  const c = mkCanvas(w, h), cg = c.getContext('2d');
  const R = (col, x, y, ww, hh) => { cg.fillStyle = col; cg.fillRect(x, y, ww, hh); };
  artFn(R, cg);
  if (outline) outlineCanvas(c, outline);
  const wr = whiteCanvas(c);
  return { r: c, l: flipCanvas(c), wr: wr, wl: flipCanvas(wr), w: w, h: h };
}
function pick(spr, face, white) { return face >= 0 ? (white ? spr.wr : spr.r) : (white ? spr.wl : spr.l); }

// ---- HERO: 海音 UMINE - blue-haired water witch (28x30, faces right) ----
// Placeholder pixel art evoking her silhouette: big navy witch hat with
// lavender band, long light-blue hair, white dress, navy cape, moon staff.
const HERO_W = 28, HERO_H = 30, HERO_CX = 16; // HERO_CX = body centre x in the right-facing frame
function artHero(R, pose, shoot) {
  const hat = '#2a2856', hatD = '#1a1838', band = '#b9adf5', gold = '#f0c860', hair = '#8fb4f5', hairD = '#5a7ed0',
    skin = '#ffe2cf', eye = '#6a4fd0', dress = '#f6f6ff', dressS = '#c9d2ee', hem = '#a9d8ff', cape = '#24244a',
    capeIn = '#8f86d8', boot = '#2a2438', crys = '#4fa8ff', rib = '#4a4ab0';
  const hurt = pose === 'hurt', jump = pose === 'jump';
  const by = pose === 'run1' ? -1 : 0; // body bob
  // long hair behind
  R(hair, 8, 11 + by, 7, 9); R(hair, 7, 14 + by, 3, 8); R(hairD, 7, 20 + by, 3, 2); R(hairD, 9, 13 + by, 1, 7);
  // cape behind body (flutters up when airborne)
  if (jump || hurt) { R(cape, 5, 15 + by, 9, 7); R(capeIn, 4, 15 + by, 2, 5); R(gold, 7, 17 + by, 1, 1); R(gold, 10, 19 + by, 1, 1); }
  else { R(cape, 9, 15 + by, 6, 10); R(cape, 7, 20 + by, 4, 6); R(capeIn, 6, 23 + by, 2, 3); R(gold, 9, 22 + by, 1, 1); R(gold, 11, 18 + by, 1, 1); }
  // legs + boots
  if (pose === 'stand') { R(skin, 14, 25, 2, 2); R(skin, 17, 25, 2, 2); R(boot, 13, 27, 3, 3); R(boot, 17, 27, 3, 3); }
  else if (pose === 'run0') { R(skin, 12, 25, 2, 2); R(skin, 19, 25, 2, 2); R(boot, 10, 27, 4, 3); R(boot, 19, 27, 4, 3); }
  else if (pose === 'run1') { R(skin, 15, 24, 2, 2); R(boot, 14, 26, 4, 3); }
  else if (pose === 'run2') { R(skin, 14, 25, 2, 2); R(skin, 17, 25, 2, 2); R(boot, 13, 27, 3, 3); R(boot, 18, 27, 4, 3); }
  else if (jump) { R(skin, 13, 24, 2, 2); R(skin, 18, 23, 2, 2); R(boot, 12, 26, 3, 3); R(boot, 18, 25, 4, 3); }
  else if (hurt) { R(skin, 12, 25, 2, 2); R(skin, 19, 25, 2, 2); R(boot, 11, 27, 3, 3); R(boot, 19, 27, 3, 3); }
  // white dress with navy corset + blue hem
  R(dress, 13, 16 + by, 6, 5); R(rib, 15, 16 + by, 2, 1);
  R(cape, 13, 19 + by, 6, 1); R(gold, 15, 19 + by, 1, 1);
  R(dress, 12, 20 + by, 8, 3); R(dress, 11, 22 + by, 10, 2); R(dressS, 11, 23 + by, 10, 1); R(hem, 11, 24 + by, 10, 1);
  // head: face, bangs, eye
  R(skin, 14, 11 + by, 6, 5);
  R(hair, 13, 10 + by, 8, 2); R(hair, 13, 12 + by, 2, 4); R(hair, 20, 11 + by, 1, 5);
  if (hurt) R('#6a4a5a', 17, 13 + by, 2, 1);
  else { R(eye, 17, 12 + by, 2, 2); R('#ffffff', 17, 12 + by, 1, 1); }
  R('#ffb6c8', 18, 14 + by, 1, 1);
  // witch hat (tip bends backwards) with lavender band, star and crystal charm
  R(hat, 5, 0 + by, 2, 1); R(hat, 6, 1 + by, 3, 1); R(hat, 8, 2 + by, 4, 1); R(hat, 9, 3 + by, 5, 1);
  R(hat, 10, 4 + by, 6, 1); R(hat, 10, 5 + by, 7, 1); R(band, 10, 6 + by, 9, 2);
  R(hat, 6, 8 + by, 18, 1); R(hatD, 7, 9 + by, 17, 1); R(gold, 13, 4 + by, 1, 1);
  R(gold, 4, 1 + by, 1, 2); R(crys, 3, 3 + by, 2, 2);
  // arm + crescent-moon staff
  if (shoot) {
    R(dress, 18, 16 + by, 4, 2); R(skin, 22, 16 + by, 1, 2);
    R(gold, 19, 17 + by, 6, 1);
    R(gold, 24, 14 + by, 2, 1); R(gold, 26, 15 + by, 1, 4); R(gold, 24, 19 + by, 2, 1); R(crys, 24, 16 + by, 2, 2);
  } else {
    if (jump || hurt) { R(dress, 18, 14 + by, 2, 4); R(skin, 20, 14 + by, 1, 2); }
    else { R(dress, 18, 16 + by, 2, 4); R(skin, 20, 19 + by, 1, 2); }
    R(gold, 21, 9 + by, 1, 18);
    R(gold, 21, 3 + by, 2, 1); R(gold, 23, 4 + by, 1, 4); R(gold, 21, 8 + by, 2, 1); R(crys, 21, 5 + by, 2, 2);
  }
}
// ---- WALKER: "TRUNDLEBOT" (16x22): body + treads in the bottom 16px, sensor mast on top ----
function artWalker(R, f) {
  const T = 6; // body offset (mast/sensor head live in the top 6px)
  R('#6b7288', 4, 3, 2, 4 + T - 3); R('#9aa3b8', 4, 3, 1, 4 + T - 3);             // mast
  R('#5b6278', 2, 0, 6, 3); R('#9aa3b8', 3, 0, 4, 1); R('#ff5d5d', 5, 1, 2, 1);  // sensor head + lamp
  if ((f & 1) === 0) R('#ffd08a', 6, 1, 1, 1);
  R('#ff9a3c', 2, 3 + T, 12, 8); R('#c8621e', 2, 9 + T, 12, 2); R('#ffd08a', 3, 4 + T, 5, 1);
  R('#ffffff', 7, 5 + T, 5, 4); R('#10223a', 10, 6 + T, 2, 2);
  R('#3b3b4f', 1, 11 + T, 14, 5); R('#5a5a75', 2, 11 + T, 12, 1);
  for (let i = 0; i < 3; i++) R('#b0b0cc', 2 + i * 4 + f * 2, 13 + T, 2, 2);
}
// ---- HOPPER: "SPRINGO" (16x22), f=0 crouch, f=1 airborne; eyes on stalks ----
function artHopper(R, f) {
  const T = 6, dy = f ? -4 : 0, ey = f ? 0 : 3; // body offset, airborne lift, eyeball top
  R('#3a9a3a', 4, ey + 3, 2, 8 + T - ey - 3 + dy); R('#3a9a3a', 10, ey + 3, 2, 8 + T - ey - 3 + dy); // stalks
  R('#5fd35a', 3, ey, 4, 4); R('#5fd35a', 9, ey, 4, 4);                                            // eyeballs
  R('#ffffff', 4, ey + 1, 2, 2); R('#ffffff', 10, ey + 1, 2, 2); R('#10223a', 5, ey + 1, 1, 2); R('#10223a', 11, ey + 1, 1, 2);
  R('#5fd35a', 2, 7 + T + dy, 12, 6); R('#3a9a3a', 2, 11 + T + dy, 12, 2); R('#b6f5a0', 3, 8 + T + dy, 4, 1);
  R('#1d4a1d', 6, 10 + T + dy, 4, 1);
  if (!f) { R('#9aa3b8', 5, 13 + T, 6, 1); R('#5b6278', 5, 14 + T, 6, 1); R('#9aa3b8', 5, 15 + T, 6, 1); }
  else { for (let i = 0; i < 7; i++) R(i & 1 ? '#5b6278' : '#9aa3b8', 6, 9 + T + i, 4, 1); }
}
// ---- FLYER: "BUZZKITE" (16x14) ----
function artFlyer(R, f) {
  R('#9aa3b8', 7, 2, 2, 3);
  if (f) R('#e6ecff', 1, 1, 14, 1); else R('#e6ecff', 4, 1, 8, 1);
  R('#a45ee5', 3, 5, 10, 6); R('#7a3cb8', 3, 9, 10, 2); R('#d6a8ff', 4, 6, 4, 1);
  R('#ffffff', 8, 6, 4, 3); R('#ff3b3b', 10, 7, 2, 1);
  R('#6b7288', 7, 11, 2, 2);
}

function artTobiume(R, pose, c, f) {

  if (pose === 'fly') { R(c.dressW, 17, 27, 3, 6); R(c.dressW, 21, 27, 3, 5); R(c.boot, 15, 32, 4, 3); R(c.boot, 20, 31, 4, 3); }
  else if (pose === 'kick') { R(c.dressW, 22, 26, 3, 3); R(c.dressW, 24, 28, 4, 3); R(c.dressW, 27, 30, 3, 3); R(c.boot, 29, 31, 6, 4); R(c.dressW, 17, 27, 3, 5); R(c.boot, 15, 31, 4, 3); }
  else { R(c.dressW, 19, 27, 3, 8); R(c.dressW, 23, 27, 3, 8); R(c.boot, 18, 34, 4, 4); R(c.boot, 23, 34, 4, 4); R(c.dressPL, 19, 34, 3, 1); R(c.dressPL, 23, 34, 3, 1); }
  // skirt + bodice
  R(c.dressP, 16, 22, 12, 3); R(c.dressW, 15, 25, 14, 2); R(c.dressPL, 15, 26, 14, 1);
  R(c.dressW, 19, 16, 6, 6); R(c.dressP, 20, 16, 4, 2); R(c.gem, 21, 18, 2, 1); R(c.dressP, 18, 21, 8, 1);

  else { R(c.glove, 24, 17, 2, 6); }

// =====================================================================
//  Fixed-step update (60Hz)
// =====================================================================
function update() {
  frame++; stats.updates++; stateT++;
  inp.left = keys.left || touch.left; inp.right = keys.right || touch.right;
  inp.jump = keys.jump || touch.jump; inp.shoot = keys.shoot || touch.shoot;
  if (hitStop > 0) { hitStop--; }
  else {
    switch (state) {
      case 'title':
        titleScroll += 0.5;
        if (resetArmT > 0) resetArmT--;
        if (inp.resetPressed && clearedCount() > 0) {   // erase progress: press/tap twice within 3 s
          if (resetArmT > 0) { eraseProgress(); resetArmT = 0; sfx('erase'); } else { resetArmT = 180; sfx('buzz'); }
        } else if (inp.startPressed && stateT > 10) { sfx('start'); openSelect(selCursor); }
        break;
      case 'select':
        titleScroll += 0.25;
        updateSelect();
        break;
      case 'areaIntro':
        updateAreaIntro();
        break;
      case 'ready':
        updateCamera();
        if (stateT >= 50) setState('play');
        break;
      case 'play':
        stats.playFrames++;
        updatePlayer();
        if (state !== 'play') break;
        updateEnemies(); updateAllies(); updateBoss(); updateShots(); updateArrows(); updateBullets(); playerContacts();
        updateCamera(); checkTriggers();
        break;
      case 'bossIntro':
        updateBossIntro();
        break;
      case 'dying':
        if (stateT >= 100) setState('gameover');
        break;
      case 'gameover':
        if (inp.startPressed && stateT > 30) resetStage(checkpoint);
        break;
      case 'clear':  // back to the stage select, cursor on the cleared area (now marked)
        if (inp.startPressed && stateT > 60) { resetStage(false); openSelect(curArea.slot); }
        break;
    }
    updateParticles();
    if (shakeT > 0) shakeT--;
  }
  inp.jumpPressed = false; inp.shootPressed = false; inp.startPressed = false; inp.enterPressed = false; inp.resetPressed = false; inp.backPressed = false;
  inp.leftPressed = false; inp.rightPressed = false; inp.upPressed = false; inp.downPressed = false;
}

    dim(Math.min(0.6, stateT / 40));

    drawText(BOSS_TYPES[curArea.boss].clearEn, VW / 2, 100, 'c', 1, 'c');
    const secs = Math.floor(stats.playFrames / 60);
    drawText('TIME ' + Math.floor(secs / 60) + ':' + (secs % 60 < 10 ? '0' : '') + (secs % 60) + '   KILLS ' + stats.kills, VW / 2, 114, 'w', 1, 'c');
    if (stateT > 60 && (frame >> 5) & 1) drawTextShadow('TAP OR ENTER: STAGE SELECT', VW / 2, 150, 'w', 1, 'c');
  }
  blit();
  // ---- high-res overlays: speech bubbles / dialogue / Japanese lines ----
  if (state === 'play' || state === 'ready' || state === 'bossIntro') {
    for (let i = 0; i < allies.length; i++) {
      const a = allies[i]; if (a.bubbleT <= 0) continue;
      const sx2 = a.x - camX; if (sx2 < -10 || sx2 > VW + 10) continue;
      const info = ALLY_INFO[a.type];
      drawBubble(sx2, a.y - 34, info.name, info.color, a.line, a.bubbleT < 20 ? a.bubbleT / 20 : 1);
    }
  }
  const BT = BOSS_TYPES[curArea.boss];
  if (boss.state === 'rescue' && boss.t >= 100 && state === 'play') drawDialogue(BT.speaker, BT.speakerColor, BT.line, Math.min(1, (boss.t - 100) / 15), 36); // top: keeps both characters visible
  if (state === 'clear') drawHiText(BT.clearJp, VW / 2, 126, 8, '#ffc0dc', '#120e24');
}
function blit() { sctx.imageSmoothingEnabled = false; sctx.drawImage(buf, 0, 0, screen.width, screen.height); }

// =====================================================================
//  Main loop: fixed 60Hz simulation, render every animation frame
// =====================================================================
const STEP = 1000 / 60;
let lastT = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = now - lastT; lastT = now;
  if (dt > 250) dt = 250; if (dt < 0) dt = 0;
  acc += dt; let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n >= 5) acc = 0;
  render();
}
loadSheets();
resetStage(false); setState('title');
requestAnimationFrame(loop);

// Debug / test hook (harmless in production)
window.ROCKSIDE = { CONFIG, P, boss, enemies, stats, cam, layout, DEBUG, shots, bullets, allies, arrows, SHEETS_LOADED, SHEET_DEFS,
  AREAS, progress, PROGRESS_KEY, SEL, SEL_BACK, TITLE_RESET, cellRect, clearedCount, finalUnlocked,
  get state() { return state; }, get stateT() { return stateT; }, get checkpoint() { return checkpoint; },
  get selCursor() { return selCursor; }, get selMsg() { return selMsg; }, get curArea() { return curArea.id; }, get resetArmed() { return resetArmT > 0; },
  teleport(x, y) { P.x = x; P.y = y; P.vx = 0; P.vy = 0; cam.x = clampCam(x - VW / 2); },
  _test: { loadArea },
  get roomX() { return ROOM_X; }, get cpX() { return CP_C * TS; }, get levelW() { return LEVEL_W; } };
</script>
