<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d0f1a;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
body{position:fixed;inset:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
#screen{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;background:#000;}
#pad{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;z-index:2;}
.btn{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  color:#d6e6ff;font:800 16px/1 system-ui,-apple-system,sans-serif;letter-spacing:1px;
  border:3px solid #4a5a80;background:#1c2338;box-shadow:0 6px 0 #070a14;
  transition:transform 45ms,background-color 45ms,box-shadow 45ms;pointer-events:none;}
.btn svg{width:46%;height:46%;}
.btn.on{transform:translateY(5px) scale(.94);box-shadow:0 1px 0 #070a14;color:#fff;}
.dpad{border-radius:20px;}
.dpad.on{background:#3a64c8;border-color:#a9c8ff;}
.round{border-radius:50%;}
#bS{border-color:#b85068;background:#2c1822;}
#bS.on{background:#d8466a;border-color:#ffb3c4;}
#bJ{border-color:#4fae6e;background:#16281e;}
#bJ.on{background:#3fbf68;border-color:#bfffd2;}
#mute{position:absolute;box-sizing:border-box;padding:0 10px;height:30px;border-radius:15px;text-align:center;
  border:2px solid #3a4666;background:#141a2c;color:#9fb0d8;font:700 12px/26px system-ui,sans-serif;letter-spacing:1px;
  pointer-events:auto;white-space:nowrap;}
#mute.off{color:#ff8a8a;border-color:#6a3040;}
#hint{position:absolute;left:0;width:100%;text-align:center;color:#46557a;font:600 11px/1.3 system-ui,sans-serif;pointer-events:none;letter-spacing:1px;}
body.land .btn{opacity:.6;}
body.land .btn.on{opacity:.9;}
body.land #hint{display:none;}
</style>
</head>

  for (const p of poses) SPR.hero[p] = [makeSprite(HERO_W, HERO_H, R => artHero(R, p, 0), OUT), makeSprite(HERO_W, HERO_H, R => artHero(R, p, 1), OUT)];
  for (let f = 0; f < 2; f++) {
    SPR.walker.push(makeSprite(16, 22, R => artWalker(R, f), [26, 15, 10]));
    SPR.hopper.push(makeSprite(16, 22, R => artHopper(R, f), [12, 30, 14]));
    SPR.flyer.push(makeSprite(16, 14, R => artFlyer(R, f), [30, 12, 44]));
    SPR.sentry.push(makeSprite(16, 22, R => artSentry(R, f), [22, 24, 42]));
  }
  // water bullet (droplet pointing right; flipped copy used for left)
  SPR.shot = makeSprite(8, 6, R => { R('#bfeaff', 0, 2, 2, 2); R('#3a8fd8', 2, 1, 5, 4); R('#3a8fd8', 3, 0, 3, 6); R('#7fd6ff', 3, 1, 4, 4); R('#ffffff', 5, 1, 1, 2); }, null);
  SPR.ebullet = makeSprite(5, 5, R => { R('#ff7ad9', 1, 0, 3, 5); R('#ff7ad9', 0, 1, 5, 3); R('#ffffff', 2, 1, 1, 3); R('#ffffff', 1, 2, 3, 1); }, null);
  // Dark Tobiume's magic: heart + star bullets (8x7 / 7x7)
  SPR.heart = makeSprite(8, 7, R => { R('#c0206a', 1, 0, 2, 1); R('#c0206a', 5, 0, 2, 1); R('#c0206a', 0, 1, 8, 3); R('#c0206a', 1, 4, 6, 1); R('#c0206a', 2, 5, 4, 1); R('#c0206a', 3, 6, 2, 1); R('#ff7ab8', 1, 1, 2, 2); R('#ffffff', 1, 1, 1, 1); }, [40, 6, 30]);
  SPR.star = makeSprite(7, 7, R => { R('#a040d0', 3, 0, 1, 7); R('#a040d0', 0, 3, 7, 1); R('#a040d0', 2, 1, 3, 5); R('#a040d0', 1, 2, 5, 3); R('#ff9ad8', 3, 2, 1, 3); R('#ff9ad8', 2, 3, 3, 1); R('#ffffff', 3, 3, 1, 1); }, [30, 6, 40]);
})();

// 48x48 portrait box: the 24x24 face icon at 2x (dark face until cleared/rescued, then the normal face).
// Fallback when the icons are missing: 20x20 sheet crop at 2x (centred), then procedural art.
function portraitFace(a) { return (isRescued(a.friend) || isCleared(a.id)) ? a.faceRescued : a.face; }
function drawPortrait(a, x, y) {
  const rescued = isRescued(a.friend) || isCleared(a.id), fk = portraitFace(a);
  if (fk && SHEETS[fk]) { g.drawImage(SHEETS[fk][0].r, x, y, 48, 48); return; }
  x += 4; y += 4;
  let P0 = rescued && a.portraitRescued ? a.portraitRescued : a.portrait; if (!P0) return;
  const shadow = P0.shadow && !rescued;
  const fr = shadow ? shadowFrames(P0.sheet) : SHEETS[P0.sheet];
  if (fr && fr[P0.frame]) { g.drawImage(fr[P0.frame].r, P0.x, P0.y, P0.size, P0.size, x, y, 40, 40); return; }
  // procedural fallback art (?sprites=0)
  const pal = (a.friend === 'tobiume' && !rescued) ? 'dark' : 'normal';
  if (a.friend === 'tobiume') g.drawImage(SPR.tobi[pal].idle[0].r, 10, 0, 20, 20, x, y, 40, 40);
  else { const k = { neenia: 'N', seiten: 'S', astarte: 'A' }[a.friend]; if (k) { g.drawImage(SPR.ally[k][0].r, 6, 2, 20, 20, x, y, 40, 40); if (shadow) { g.fillStyle = 'rgba(16,8,32,0.8)'; g.fillRect(x, y, 40, 40); } } }
}
function drawCheck(x, y) { // 13x10 green check mark with dark outline
  const pts = [[0, 5], [1, 6], [2, 7], [3, 8], [4, 7], [5, 6], [6, 5], [7, 4], [8, 3], [9, 2], [10, 1], [11, 0]];
  g.fillStyle = '#0a2010'; for (const [px, py] of pts) g.fillRect(x + px - 1, y + py - 1, 4, 4);
  g.fillStyle = '#6cf07a'; for (const [px, py] of pts) g.fillRect(x + px, y + py, 2, 2);
}
function drawPadlock(cx, cy) {
  g.fillStyle = '#7a6a3a'; g.fillRect(cx - 6, cy - 12, 12, 2); g.fillRect(cx - 7, cy - 11, 2, 9); g.fillRect(cx + 5, cy - 11, 2, 9); // shackle
  g.fillStyle = '#c8a848'; g.fillRect(cx - 9, cy - 3, 18, 14); g.fillStyle = '#f0d070'; g.fillRect(cx - 9, cy - 3, 18, 2);
  g.fillStyle = '#3a2a10'; g.fillRect(cx - 1, cy + 1, 3, 3); g.fillRect(cx, cy + 3, 1, 4);
}
function drawCell(slot) {
  const R = cellRect(slot), a = areaAtSlot(slot);
  const playable = !!(a && a.map), locked = !!(a && a.final && !finalUnlocked()), cleared = !!(a && !a.final && isCleared(a.id));
  const friendCell = !!(a && (a.face || a.portrait));     // a DARK <friend> boss slot (playable or coming soon)
  g.fillStyle = playable ? '#1c2244' : friendCell ? '#1a1630' : '#141830'; g.fillRect(R.x, R.y, R.w, R.h);
  rectLine(R.x, R.y, R.w, R.h, cleared ? '#4a9a6a' : playable ? '#4a5a90' : friendCell ? '#44305e' : '#2c3558');
  const px = R.x + 12, py = R.y + 2;                      // 52x52 portrait frame (48x48 inside = face icon at 2x)
  g.fillStyle = '#080a16'; g.fillRect(px, py, 52, 52);
  rectLine(px, py, 52, 52, cleared ? '#8af0a0' : playable ? '#9aa8e0' : friendCell ? '#7a4a9a' : a && a.final ? '#7a6a3a' : '#3a4468');
  if (friendCell) {
    if (playable) { const th = THEMES[a.theme] || THEMES.sunset; // portrait background = the area's sky colours
      g.fillStyle = th.sky[cleared ? 2 : 1]; g.fillRect(px + 2, py + 2, 48, 48); g.fillStyle = th.sky[cleared ? 1 : 2]; g.fillRect(px + 2, py + 36, 48, 14); }
    else { g.fillStyle = '#5a3c80'; g.fillRect(px + 2, py + 2, 48, 48); g.fillStyle = '#7a4c90'; g.fillRect(px + 2, py + 34, 48, 16); }
    drawPortrait(a, px + 2, py + 2);
    if (cleared) { // normal face stays visible: CLEAR ribbon along the bottom + check badge
      g.fillStyle = 'rgba(6,20,12,0.82)'; g.fillRect(px + 2, py + 40, 48, 10); drawText('CLEAR', px + 26, py + 42, 'g', 1, 'c');
      g.fillStyle = '#0a2010'; g.fillRect(px + 35, py + 3, 15, 13); drawCheck(px + 37, py + 5);
    }
  } else if (a && a.final) {
    if (locked) drawPadlock(px + 26, py + 26);
    else { const s = SPR.star; g.drawImage(s.r, px + 10, py + 10, 32, 32); if ((frame >> 3) & 1) { g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(px + 2, py + 2, 48, 48); } }
  } else { // ??? reserved slot for a future friend
    drawTextShadow('?', px + 27, py + 14, 'b', 4, 'c');
  }
  const en = playable ? a.en : a && a.final ? (locked ? 'LOCKED' : 'FINAL AREA') : a && a.reserved ? 'LOCKED' : 'COMING SOON';
  drawText(en, R.x + R.w / 2, R.y + R.h - 7, playable ? (cleared ? 'g' : 'w') : 'b', 1, 'c');
}
function renderSelect() {
  g.fillStyle = '#0b0e20'; g.fillRect(0, 0, VW, VH);
  for (let i = 0; i < 48; i++) { // drifting stars
    const h = hash(i, 11), sp = ((h >>> 20) & 3) + 1; let x = Math.floor((h % VW) - titleScroll * sp * 0.5) % VW; if (x < 0) x += VW;
    g.fillStyle = (h >> 8) & 1 ? '#3a4270' : '#262c50'; g.fillRect(x, (h >>> 9) % VH, 1, 1);
  }
  g.fillStyle = 'rgba(22,26,56,0.96)'; g.fillRect(0, 0, VW, 21); g.fillStyle = '#ffd84a'; g.fillRect(0, 21, VW, 1);
  drawTextShadow('STAGE SELECT', VW / 2, 6, 'y', 2, 'c');
  const B = SEL_BACK; g.fillStyle = '#141a30'; g.fillRect(B.x, B.y, B.w, B.h); rectLine(B.x, B.y, B.w, B.h, '#4a5680'); drawText('TITLE', B.x + B.w / 2 + 1, B.y + 4, 'b', 1, 'c');
  drawText(clearedCount() + '/8', VW - 5, 9, clearedCount() ? 'g' : 'b', 1, 'r');
  for (let slot = 0; slot < 9; slot++) drawCell(slot);
  const R = cellRect(selCursor);
  if (state === 'areaIntro') { // chosen: the cell flashes quickly
    if ((stateT >> 2) & 1) { g.fillStyle = 'rgba(255,255,255,0.75)'; g.fillRect(R.x, R.y, R.w, R.h); }
    rectLine(R.x - 2, R.y - 2, R.w + 4, R.h + 4, '#ffffff'); rectLine(R.x - 1, R.y - 1, R.w + 2, R.h + 2, '#ffffff');
  } else if (((frame >> 3) & 3) !== 3) { // classic blinking cursor with corner brackets
    const c = (frame >> 2) & 1 ? '#ffd84a' : '#fff4b0';
    rectLine(R.x - 2, R.y - 2, R.w + 4, R.h + 4, c); rectLine(R.x - 1, R.y - 1, R.w + 2, R.h + 2, c);
    g.fillStyle = '#ffffff';
    for (const [cx, cy, dx, dy] of [[R.x - 3, R.y - 3, 1, 1], [R.x + R.w + 2, R.y - 3, -1, 1], [R.x - 3, R.y + R.h + 2, 1, -1], [R.x + R.w + 2, R.y + R.h + 2, -1, -1]]) {
      g.fillRect(dx > 0 ? cx : cx - 7, cy, 8, 1); g.fillRect(cx, dy > 0 ? cy : cy - 7, 1, 8);
    }
  }
  blit();
  // hi-res Japanese cell names
  for (let slot = 0; slot < 9; slot++) {
    const Rc = cellRect(slot), a = areaAtSlot(slot), playable = !!(a && a.map);
    const jp = playable ? a.name : a && a.final ? a.name : a && a.bossName ? a.bossName : '???';
    const col = playable ? (isCleared(a.id) ? '#b0ffc0' : '#ffffff') : a && a.final ? '#e8d090' : a && a.bossName ? '#d0a0ff' : '#8a96c0';
    drawHiText(jp, Rc.x + Rc.w / 2, Rc.y + 54.5, 7.5, col, '#080a16');
  }
  if (selMsg) drawSelMessage(selMsg, Math.min(1, (110 - selMsgT) / 6 + 0.2));
}
function drawSelMessage(m, alpha) { // centred message box over the grid (hi-res)
  const s = hiS(), x = Math.round(14 * s), w = Math.round(228 * s), y = Math.round(92 * s), h = Math.round(54 * s);
  sctx.save(); sctx.globalAlpha = alpha;
  sctx.fillStyle = '#0a0a1c'; sctx.strokeStyle = '#ffd84a'; sctx.lineWidth = Math.max(2, Math.round(s));
  roundRect(x, y, w, h, Math.round(3 * s)); sctx.fill(); sctx.stroke(); sctx.restore();
  drawHiText(m.jp, VW / 2, 103, 8.5, '#ffffff', null);
  drawHiText(m.en, VW / 2, 124, 8, '#ffd84a', null);
}
function renderAreaIntro() {
  const t = stateT - 24, a = introArea;
  g.fillStyle = '#05060f'; g.fillRect(0, 0, VW, VH);
  for (let i = 0; i < 56; i++) { // stars streaking left
    const h = hash(i, 23), sp = ((h >>> 20) & 3) + 1; let x = Math.floor((h % VW) - t * sp * 1.5) % VW; if (x < 0) x += VW;
    g.fillStyle = sp > 2 ? '#8a90c0' : '#3a4070'; g.fillRect(x, (h >>> 9) % VH, sp > 2 ? 3 : 1, 1);
  }
  const bandY = 66, bandH = 110;
  g.fillStyle = '#1c1240'; g.fillRect(0, bandY, VW, bandH);
  g.fillStyle = '#261a52'; for (let y = bandY + ((t >> 1) & 3); y < bandY + bandH; y += 4) g.fillRect(0, y, VW, 1);
  const BT = BOSS_TYPES[a.boss] || BOSS_TYPES.tobiume;
  g.fillStyle = BT.speakerColor; g.fillRect(0, bandY, VW, 2); g.fillRect(0, bandY + bandH - 2, VW, 2);
  // boss drops into the band (2x): idle frames of her DARK sheet (procedural fallback)
  const fr = SHEETS[BT.dark], size = fr ? 48 : 40;
  let img;
  if (fr) img = fr[(frame >> 4) & 1].r;
  else if (a.boss === 'tobiume') img = SPR.tobi.dark.idle[(frame >> 3) & 1].r;
  else { const k = BT.ally; SPR.allyDark = SPR.allyDark || {}; if (!SPR.allyDark[k + 0]) SPR.allyDark[k + 0] = sheetSprite(tintCanvas(SPR.ally[k][0].r, '#1a0828', 0.72)); img = SPR.allyDark[k + 0].r; }
  const ty = bandY + bandH - 2 - size * 2 + 6, y = t < 26 ? Math.round(-size * 2 + (ty + size * 2) * (1 - Math.pow(1 - t / 26, 2))) : ty;
  g.save(); g.beginPath(); g.rect(0, 0, VW, bandY + bandH - 2); g.clip();
  g.drawImage(img, 14, y, size * 2, size * 2); g.restore();
  // boss name typed letter by letter (pixel font), JP name below (hi-res, after blit)
  const words = a.bossEn.split(' '); let n = Math.max(0, Math.floor((t - 30) / 3));
  for (let i = 0; i < words.length; i++) {
    const wd = words[i].slice(0, Math.max(0, n)); n -= words[i].length;
    drawTextShadow(wd, 128, bandY + 18 + i * 16, 'y', 2);
  }
  drawText('AREA ' + areaNo(a), VW / 2, 24, 'c', 1, 'c');
  drawText(a.en, VW / 2, 50, 'w', 1, 'c');
  if (t > 70 && ((frame >> 4) & 1)) drawTextShadow('TAP TO START', VW / 2, 206, 'w', 1, 'c');
  if (t < 8) { g.fillStyle = 'rgba(255,255,255,' + (1 - t / 8) + ')'; g.fillRect(0, 0, VW, VH); } // white flash
  blit();
  drawHiText(a.name, VW / 2, 33, 10, '#ffd6ec', '#120e24');
  if (t > 30 + a.bossEn.replace(' ', '').length * 3) drawHiText(a.bossName, 188, bandY + 58, 12, '#ffffff', '#3a0a28');
  if (t > 50 && a.bossAlias) drawHiText('〜 ' + a.bossAlias + ' 〜', 188, bandY + 80, 7.5, BT.speakerColor, '#120e24');
}

function render() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (state === 'title') { renderTitle(); blit(); drawHiText('〜 水の魔女と堕ちた天使 〜', VW / 2, 102, 8, '#ffd6ec', '#120e24'); return; }
  if (state === 'select' || (state === 'areaIntro' && stateT < 24)) { renderSelect(); return; }
  if (state === 'areaIntro') { renderAreaIntro(); return; }
  const camX = Math.round(cam.x);
  drawBackground(camX);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = (shakeT & 1 ? 1 : -1) * shakeMag; sy = ((shakeT >> 1) & 1 ? 1 : -1) * Math.max(1, shakeMag >> 1); }
  g.setTransform(1, 0, 0, 1, sx, sy);
  g.drawImage(levelCv, camX, 0, VW, VH, 0, 0, VW, VH);
  drawDoor(camX); drawAllies(camX);
  for (let i = 0; i < enemies.length; i++) { const e = enemies[i]; if (e.alive && e.active) drawEnemy(e, camX); }
  drawBoss(camX);
  if (!(state === 'ready' && (stateT & 8))) drawPlayer(camX);
  for (let i = 0; i < shots.length; i++) if (shots[i].active) drawShot(shots[i], camX);
  drawArrows(camX);
  for (let i = 0; i < bullets.length; i++) if (bullets[i].active) drawBullet(bullets[i], camX);
  drawParticles(camX);
  if (DEBUG.hitbox) drawHitboxes(camX);
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawHUD();
  if (state === 'ready' && ((stateT >> 3) & 1) === 0) drawTextShadow('GET SET!', VW / 2, 104, 'y', 2, 'c');
  if (state === 'bossIntro' && introPhase === 2 && (frame >> 3) & 1) drawTextShadow('WARNING', VW / 2, 60, 'r', 2, 'c');
  if (state === 'gameover') {
    dim(Math.min(0.7, stateT / 30));
    drawTextShadow('GAME OVER', VW / 2, 84, 'r', 3, 'c');
    if (stateT > 30 && (frame >> 5) & 1) drawTextShadow('TAP OR ENTER TO RETRY', VW / 2, 120, 'w', 1, 'c');
    drawText(checkpoint ? 'RESTART FROM CHECKPOINT' : 'RESTART FROM STAGE START', VW / 2, 136, 'b', 1, 'c');
  }
  if (state === 'clear') {
    dim(Math.min(0.6, stateT / 40));
    drawTextShadow('STAGE CLEAR!', VW / 2, 70, 'y', 3, 'c');
    drawText(BOSS_TYPES[curArea.boss].clearEn, VW / 2, 100, 'c', 1, 'c');
    const secs = Math.floor(stats.playFrames / 60);
    drawText('TIME ' + Math.floor(secs / 60) + ':' + (secs % 60 < 10 ? '0' : '') + (secs % 60) + '   KILLS ' + stats.kills, VW / 2, 114, 'w', 1, 'c');
    if (stateT > 60 && (frame >> 5) & 1) drawTextShadow('TAP OR ENTER: STAGE SELECT', VW / 2, 150, 'w', 1, 'c');
  }
  blit();
  // ---- high-res overlays: speech bubbles / dialogue / Japanese lines ----
  if (state === 'play' || state === 'ready' || state === 'bossIntro') {
    for (let i = 0; i < allies.length; i++) {
      const a = allies[i]; if (a.bubbleT <= 0) continue;
      const sx2 = a.x - camX; if (sx2 < -10 || sx2 > VW + 10) continue;
      const info = ALLY_INFO[a.type];
      drawBubble(sx2, a.y - 34, info.name, info.color, a.line, a.bubbleT < 20 ? a.bubbleT / 20 : 1);
    }
  }
  const BT = BOSS_TYPES[curArea.boss];
  if (boss.state === 'rescue' && boss.t >= 100 && state === 'play') drawDialogue(BT.speaker, BT.speakerColor, BT.line, Math.min(1, (boss.t - 100) / 15), 36, BT.face); // top: keeps both characters visible
  if (state === 'clear') drawHiText(BT.clearJp, VW / 2, 126, 8, '#ffc0dc', '#120e24');
}
// Fill the screen at any size without shimmer: blow the frame up by a whole number with
// hard edges first, then shrink that smoothly to the real size. Every game pixel ends up
// the same width; only its outer edge is softened by under one screen pixel.
let blitMid = null, blitK = 0;
function blit() {
  const sw = screen.width, sh = screen.height;
  const k = Math.max(1, Math.ceil(Math.min(sw / VW, sh / VH) - 1e-6));
  if (VW * k === sw && VH * k === sh) { sctx.imageSmoothingEnabled = false; sctx.drawImage(buf, 0, 0, sw, sh); return; }
  if (!blitMid || blitK !== k) { blitMid = mkCanvas(VW * k, VH * k); blitK = k; }
  const mg = blitMid.getContext('2d');
  mg.imageSmoothingEnabled = false; mg.drawImage(buf, 0, 0, VW * k, VH * k);
  sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = 'high';
  sctx.drawImage(blitMid, 0, 0, sw, sh);
  sctx.imageSmoothingEnabled = false;
}

// =====================================================================
//  Main loop: fixed 60Hz simulation, render every animation frame
// =====================================================================
const STEP = 1000 / 60;
let lastT = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = now - lastT; lastT = now;
  if (dt > 250) dt = 250; if (dt < 0) dt = 0;
  acc += dt; let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n >= 5) acc = 0;
  render();
}
loadSheets();
resetStage(false); setState('title');
if (DEBUG.area) { const a = AREAS.find(x => x.no === DEBUG.area && x.map); if (a) startGame(a); } // ?area=N: straight into the stage
requestAnimationFrame(loop);

// Debug / test hook (harmless in production)
window.ROCKSIDE = { CONFIG, P, boss, enemies, stats, cam, layout, DEBUG, shots, bullets, allies, arrows, SHEETS_LOADED, SHEET_DEFS,
  AREAS, progress, PROGRESS_KEY, SEL, SEL_BACK, TITLE_RESET, cellRect, clearedCount, finalUnlocked,
  get state() { return state; }, get stateT() { return stateT; }, get checkpoint() { return checkpoint; },
  get selCursor() { return selCursor; }, get selMsg() { return selMsg; }, get curArea() { return curArea.id; }, get bossSeen() { return boss.seen.slice(); }, get floorY() { return FLOOR_Y; }, get resetArmed() { return resetArmT > 0; },
  teleport(x, y) { P.x = x; P.y = y; P.vx = 0; P.vy = 0; cam.x = clampCam(x - VW / 2); },
  _test: { loadArea, isCleared, isRescued, keys, inp, portraitFace, solidAt: solid, barGeom }, BOSS_TYPES,
  get roomX() { return ROOM_X; }, get cpX() { return CP_C * TS; }, get levelW() { return LEVEL_W; } };
</script>
